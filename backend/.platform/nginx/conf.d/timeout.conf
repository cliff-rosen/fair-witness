# Timeouts for long-running LLM analyses and SSE streaming (/api/analysis/stream).
# Extends EB's default nginx proxy config.
proxy_connect_timeout 300s;
proxy_send_timeout 300s;
proxy_read_timeout 300s;
send_timeout 300s;

# SSE: don't buffer the streamed response, and give it room.
proxy_buffering off;
proxy_buffer_size 128k;
proxy_buffers 4 256k;
proxy_busy_buffers_size 256k;
